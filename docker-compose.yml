services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: summary_api
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d summary_api"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/summary_api
      NODE_ENV: production
      PORT: 3000
      GRAPHQL_INTROSPECTION: "true"
      GRAPHQL_MAX_COMPLEXITY: "50"
      THROTTLE_TTL: "60000"
      THROTTLE_LIMIT: "100"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

volumes:
  postgres_data:
