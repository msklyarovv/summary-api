worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # ── Логи ────────────────────────────────────────────────────────────────
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    # ── Производительность ──────────────────────────────────────────────────
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    server_tokens   off;

    gzip            on;
    gzip_types      text/plain application/json application/javascript text/css;
    gzip_min_length 1000;
    gzip_comp_level 5;

    # ── Rate limiting ────────────────────────────────────────────────────────
    # Зона: 10 МБ для хранения состояний, 30 запросов/сек с одного IP
    limit_req_zone  $binary_remote_addr zone=api:10m rate=30r/s;
    limit_req_status 429;

    # ── Upstream ─────────────────────────────────────────────────────────────
    upstream api {
        server api:3000;
        keepalive 32;
    }

    # ── HTTP → HTTPS редирект ────────────────────────────────────────────────
    server {
        listen 80;
        server_name _;

        # Let's Encrypt ACME challenge (certbot)
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── HTTPS ────────────────────────────────────────────────────────────────
    server {
        listen 443 ssl http2;
        server_name _;

        # SSL-сертификаты (Let's Encrypt через certbot)
        # Раскомментировать после получения сертификата:
        # ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
        # ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;
        # include             /etc/letsencrypt/options-ssl-nginx.conf;
        # ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

        # Временно: self-signed для запуска без домена
        ssl_certificate     /etc/nginx/ssl/selfsigned.crt;
        ssl_certificate_key /etc/nginx/ssl/selfsigned.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        # ── Security headers (дополняют Helmet на уровне NestJS) ─────────────
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options           DENY                                  always;
        add_header X-Content-Type-Options    nosniff                               always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin"     always;

        # ── Health check (без rate limit — для балансировщика) ───────────────
        location /health {
            proxy_pass         http://api;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            access_log         off;
        }

        # ── GraphQL API ───────────────────────────────────────────────────────
        location /graphql {
            limit_req zone=api burst=20 nodelay;

            proxy_pass         http://api;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection        "";

            # GraphQL-запросы с большим телом (схема + интроспекция)
            client_max_body_size 1m;

            proxy_read_timeout  30s;
            proxy_send_timeout  30s;
            proxy_connect_timeout 5s;
        }
    }
}
